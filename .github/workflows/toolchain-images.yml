name: Toolchain Images

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Candidate build scope
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-diagnostic
  push:
    branches:
      - main
    paths:
      - .gitattributes
      - .github/docker/Dockerfile.gcc16
      - .github/docker/Dockerfile.p2996
      - .github/docker/docker-bake.hcl
      - .github/docker/toolchain-sources.lock
      - .github/docker/toolchains.lock
      - .github/scripts/bootstrap-toolchain-sources.py
      - .github/scripts/build-p2996-macos.sh
      - .github/scripts/validate-toolchain-locks.py
      - .github/scripts/verify-p2996-toolchain.sh
      - .github/workflows/toolchain-images.yml

permissions:
  contents: read

concurrency:
  group: typelayout-toolchain-publication
  queue: max
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ximicpp
  GCC_REPOSITORY: ghcr.io/ximicpp/typelayout-gcc16
  P2996_REPOSITORY: ghcr.io/ximicpp/typelayout-p2996

jobs:
  initialize_candidate_batch:
    name: Initialize or recover the immutable candidate batch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      candidate_artifact_id: ${{ steps.select_artifact.outputs.artifact_id }}
      candidate_batch_id: ${{ steps.manifest.outputs.candidate_batch_id }}
      workflow_run: ${{ steps.manifest.outputs.workflow_run }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the committed source lock
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-toolchain-locks.py \
            --sources .github/docker/toolchain-sources.lock \
            --recipe-root .

      - name: Find an existing immutable batch manifest for this run
        id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/candidate-batch-lookup
          gh api --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100&name=candidate-batch-manifest" \
            > build/candidate-batch-lookup/pages.json
          python3 - build/candidate-batch-lookup/pages.json "${GITHUB_OUTPUT}" <<'PY'
          import json
          import pathlib
          import sys

          pages = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(pages, list) or any(not isinstance(page, dict) for page in pages):
              raise SystemExit("invalid candidate batch artifact response")
          artifacts = []
          for page in pages:
              values = page.get("artifacts")
              if not isinstance(values, list):
                  raise SystemExit("candidate batch artifact page has no artifact list")
              artifacts.extend(values)
          matches = [item for item in artifacts if item.get("name") == "candidate-batch-manifest"]
          if len(matches) > 1:
              raise SystemExit("multiple immutable candidate batch manifests exist")
          artifact_id = ""
          existing = bool(matches)
          if existing:
              artifact = matches[0]
              if artifact.get("expired") is not False:
                  raise SystemExit("candidate batch manifest is expired")
              artifact_id = artifact.get("id")
              if isinstance(artifact_id, bool) or not isinstance(artifact_id, int) or artifact_id <= 0:
                  raise SystemExit("candidate batch manifest artifact id is invalid")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"existing={str(existing).lower()}\n")
              output.write(f"artifact_id={artifact_id}\n")
          PY

      - name: Download the exact existing batch manifest
        if: steps.lookup.outputs.existing == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.lookup.outputs.artifact_id }}
          merge-multiple: true
          path: build/candidate-batch

      - name: Materialize and validate the canonical batch identity
        id: manifest
        shell: bash
        env:
          EXISTING_BATCH: ${{ steps.lookup.outputs.existing }}
        run: |
          set -euo pipefail
          python3 - build/candidate-batch/manifest.json "${GITHUB_OUTPUT}" <<'PY'
          # BEGIN CANDIDATE BATCH MANIFEST
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate candidate batch manifest key: {key}")
                  result[key] = value
              return result

          manifest_path, output_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          source_path = pathlib.Path(".github/docker/toolchain-sources.lock")
          source_sha = os.environ["GITHUB_SHA"]
          sources_sha256 = hashlib.sha256(source_path.read_bytes()).hexdigest()
          run_id = os.environ["GITHUB_RUN_ID"]
          current_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("candidate source SHA is not canonical")
          if re.fullmatch(r"[0-9a-f]{64}", sources_sha256) is None:
              raise SystemExit("candidate source-lock digest is not canonical")
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None or current_attempt <= 0:
              raise SystemExit("candidate workflow run identity is not canonical")
          candidate_batch_id = f"{source_sha}:{sources_sha256}:{run_id}"
          producer_workflow_run = f"{run_id}.{current_attempt}"
          exact_keys = {
              "schema", "source_sha", "sources_sha256", "candidate_batch_id", "workflow_run",
          }
          existing = os.environ["EXISTING_BATCH"] == "true"
          if existing:
              if not manifest_path.is_file() or set(manifest_path.parent.iterdir()) != {manifest_path}:
                  raise SystemExit("existing candidate batch artifact is not exact")
              manifest_text = manifest_path.read_text(encoding="utf-8")
              record = json.loads(manifest_text, object_pairs_hook=reject_duplicates)
              canonical_text = json.dumps(record, indent=2, sort_keys=True) + "\n"
              if manifest_text != canonical_text:
                  raise SystemExit("existing candidate batch manifest bytes are not canonical")
          else:
              if manifest_path.parent.exists() and any(manifest_path.parent.iterdir()):
                  raise SystemExit("new candidate batch directory is not empty")
              record = {
                  "schema": 1,
                  "source_sha": source_sha,
                  "sources_sha256": sources_sha256,
                  "candidate_batch_id": candidate_batch_id,
                  "workflow_run": producer_workflow_run,
              }
              manifest_path.parent.mkdir(parents=True, exist_ok=True)
              with open(manifest_path, "w", encoding="utf-8", newline="\n") as output:
                  json.dump(record, output, indent=2, sort_keys=True)
                  output.write("\n")
          if set(record) != exact_keys:
              raise SystemExit("candidate batch manifest keys are not canonical")
          expected = {
              "schema": 1,
              "source_sha": source_sha,
              "sources_sha256": sources_sha256,
              "candidate_batch_id": candidate_batch_id,
          }
          for key, value in expected.items():
              if record.get(key) != value:
                  raise SystemExit(f"candidate batch manifest {key} mismatch")
          workflow_match = re.fullmatch(
              rf"{re.escape(run_id)}\.([1-9][0-9]*)",
              str(record["workflow_run"]),
          )
          if workflow_match is None or int(workflow_match.group(1)) > current_attempt:
              raise SystemExit("candidate batch origin is invalid or from the future")
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"candidate_batch_id={candidate_batch_id}\n")
              output.write(f"workflow_run={record['workflow_run']}\n")
          # END CANDIDATE BATCH MANIFEST
          PY

      - name: Upload the new immutable batch manifest
        id: upload_candidate
        if: steps.lookup.outputs.existing == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-batch-manifest
          path: build/candidate-batch/manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Bind the exact batch manifest artifact id
        id: select_artifact
        shell: bash
        env:
          CREATED_ARTIFACT_ID: ${{ steps.upload_candidate.outputs.artifact-id }}
          EXISTING_ARTIFACT_ID: ${{ steps.lookup.outputs.artifact_id }}
          EXISTING_BATCH: ${{ steps.lookup.outputs.existing }}
        run: |
          set -euo pipefail
          if [ "${EXISTING_BATCH}" = true ]; then
            test -n "${EXISTING_ARTIFACT_ID}"
            test -z "${CREATED_ARTIFACT_ID}"
            artifact_id="${EXISTING_ARTIFACT_ID}"
          else
            test -z "${EXISTING_ARTIFACT_ID}"
            test -n "${CREATED_ARTIFACT_ID}"
            artifact_id="${CREATED_ARTIFACT_ID}"
          fi
          case "${artifact_id}" in
            *[!0-9]*|'') echo "invalid batch artifact id" >&2; exit 1 ;;
          esac
          printf 'artifact_id=%s\n' "${artifact_id}" >> "${GITHUB_OUTPUT}"

  build_gcc_amd64:
    name: Build GCC 16.2 candidate (linux/amd64)
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all'
    needs: initialize_candidate_batch
    runs-on: ubuntu-24.04
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
    permissions:
      contents: read
      packages: write
    env:
      BATCH_WORKFLOW_RUN: ${{ needs.initialize_candidate_batch.outputs.workflow_run }}
      BAKE_TARGET: gcc16-amd64
      CANDIDATE_BATCH_ID: ${{ needs.initialize_candidate_batch.outputs.candidate_batch_id }}
      COMPILER: g++
      COMPILER_REVISION: 16.2.0
      EXPECTED_ARCH: amd64
      EXPECTED_PLATFORM: linux/amd64
      LOCK_RUNNER: ubuntu-24.04
      PROBE_NODE: x86_64_linux_gcc
      REPOSITORY: ghcr.io/ximicpp/typelayout-gcc16
      RUNNER_LABEL: ubuntu-24.04
      TOOLCHAIN: gcc
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate and load the committed source lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-toolchain-locks.py \
            --sources .github/docker/toolchain-sources.lock \
            --recipe-root .
          python3 - "${LOCK_RUNNER}" "${GITHUB_OUTPUT}" >> "${GITHUB_ENV}" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          lock_path = pathlib.Path(".github/docker/toolchain-sources.lock")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          runner = lock["linux"]["docker"]["runners"][sys.argv[1]]
          print(f"SOURCES_SHA256={hashlib.sha256(lock_path.read_bytes()).hexdigest()}")
          print(f"LOCKED_DOCKER_CLIENT={runner['client_version']}")
          print(f"LOCKED_DOCKER_SERVER={runner['server_version']}")
          buildx_version = lock["linux"]["docker"]["buildx_version"]
          print(f"LOCKED_BUILDX_VERSION={buildx_version}")
          buildkit_image = lock["linux"]["docker"]["buildkit_image"]
          print(f"LOCKED_BUILDKIT_IMAGE={buildkit_image}")
          with open(sys.argv[2], "a", encoding="utf-8") as outputs:
              outputs.write(f"buildkit_image={buildkit_image}\n")
              outputs.write(f"buildx_version={buildx_version}\n")
          PY

      - name: Verify the locked Docker and Buildx identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker version --format '{{.Client.Version}}')" = "${LOCKED_DOCKER_CLIENT}"
          test "$(docker version --format '{{.Server.Version}}')" = "${LOCKED_DOCKER_SERVER}"
          buildx_output="$(docker buildx version)"
          python3 - "${LOCKED_BUILDX_VERSION}" "${buildx_output}" <<'PY'
          import re
          import sys

          expected, output = sys.argv[1:]
          versions = re.findall(r"(?<![0-9])v?([0-9]+\.[0-9]+\.[0-9]+)(?![0-9])", output)
          if expected not in versions:
              raise SystemExit(f"Buildx version mismatch: {output!r} != {expected!r}")
          PY

      - name: Create the locked BuildKit builder
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: docker-container
          driver-opts: image=${{ steps.lock.outputs.buildkit_image }}
          version: v${{ steps.lock.outputs.buildx_version }}
          cache-binary: false

      - name: Verify the created builder
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          buildx_output="$(docker buildx version)"
          python3 - "${LOCKED_BUILDX_VERSION}" "${buildx_output}" <<'PY'
          import re
          import sys

          expected, output = sys.argv[1:]
          versions = re.findall(r"(?<![0-9])v?([0-9]+\.[0-9]+\.[0-9]+)(?![0-9])", output)
          if expected not in versions:
              raise SystemExit(f"Buildx version mismatch: {output!r} != {expected!r}")
          PY
          docker buildx inspect "${BUILDER_NAME}" --bootstrap | tee buildx-inspect.txt
          python3 - "${LOCKED_BUILDKIT_IMAGE}" buildx-inspect.txt <<'PY'
          # BEGIN BUILDX INSPECT VERIFIER
          import shlex
          import sys

          expected_image, path = sys.argv[1:]
          fields = {}
          with open(path, encoding="utf-8") as source:
              for line in source:
                  key, separator, value = line.partition(":")
                  key = key.strip()
                  if separator and key in {"Driver", "Driver Options"}:
                      fields.setdefault(key, []).append(value.strip())

          if fields.get("Driver") != ["docker-container"]:
              raise SystemExit(f"unexpected Buildx driver fields: {fields.get('Driver')!r}")
          driver_options = fields.get("Driver Options", [])
          if len(driver_options) != 1:
              raise SystemExit(f"unexpected Buildx driver option fields: {driver_options!r}")
          parsed_options = {}
          for option in shlex.split(driver_options[0]):
              name, separator, value = option.partition("=")
              if not separator or not name or name in parsed_options:
                  raise SystemExit(f"malformed Buildx driver options: {driver_options[0]!r}")
              parsed_options[name] = value
          if parsed_options != {"image": expected_image}:
              raise SystemExit(
                  f"BuildKit driver options mismatch: {parsed_options!r}"
              )
          # END BUILDX INSPECT VERIFIER
          PY

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the native manifest by digest
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p build/candidate-gcc-amd64
          docker buildx bake \
            --builder "${BUILDER_NAME}" \
            --file .github/docker/docker-bake.hcl \
            --metadata-file build/candidate-gcc-amd64/build-metadata.json \
            --set "${BAKE_TARGET}.output=type=image,push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true" \
            "gcc16-amd64"

      - name: Run the candidate probe and write its receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir=build/candidate-gcc-amd64
          manifest_digest="$(python3 - "${receipt_dir}/build-metadata.json" "${BAKE_TARGET}" <<'PY'
          import json
          import re
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))[sys.argv[2]]["containerimage.digest"]
          if re.fullmatch(r"sha256:[0-9a-f]{64}", value) is None:
              raise SystemExit(f"invalid manifest digest: {value!r}")
          print(value)
          PY
          )"
          image="${REPOSITORY}@${manifest_digest}"
          docker pull "${image}"
          docker run --rm "${image}" /tmp/toolchain-probe
          runner_image="${ImageOS-unknown}/${ImageVersion-unknown}"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --volume "${GITHUB_WORKSPACE}/${receipt_dir}:/receipt" \
            --workdir /src \
            --env COMPILER_REVISION="${COMPILER_REVISION}" \
            --env RUNNER_IMAGE="${runner_image}" \
            "${image}" \
            bash -euo pipefail -c '
              cmake -S /src -B /tmp/candidate-platform-probe -G Ninja \
                -DTYPELAYOUT_TOOLCHAIN_REVISION="${COMPILER_REVISION}"
              cmake --build /tmp/candidate-platform-probe \
                --target relocatable_world_platform_probe --parallel
              /tmp/candidate-platform-probe/relocatable_world_platform_probe \
                x86_64_linux_gcc /receipt/platform-probe.json \
                --runner ubuntu-24.04 --runner-image "${RUNNER_IMAGE}" \
                --xcode-version none --xcode-build none \
                --sdk-version none --sdk-build none \
                --deployment-target none --sdk-locked true
            '
          export MANIFEST_DIGEST="${manifest_digest}"
          python3 - "${receipt_dir}/receipt.json" "${receipt_dir}/platform-probe.json" <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          digest = os.environ["MANIFEST_DIGEST"]
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid manifest_digest")
          sys.path.insert(0, str(pathlib.Path("tools").resolve()))
          import relocatable_world_evidence as evidence
          probe = evidence.validate_probe(pathlib.Path(sys.argv[2]))
          expected_gates = {
              "char_bit": 8,
              "pointer_bits": 64,
              "endian": "little",
              "reflection": True,
              "memcpy_object_lifetime": True,
              "memcpy_array_lifetime": True,
          }
          if probe["node"] != os.environ["PROBE_NODE"] or probe["probe"] != expected_gates:
              raise SystemExit("platform probe identity or capability mismatch")
          if set(probe["admission"].values()) != {True}:
              raise SystemExit("candidate must admit all four contract types")
          if probe["environment"]["runner"] != os.environ["RUNNER_LABEL"]:
              raise SystemExit("platform probe runner mismatch")
          compiler = probe["compiler"]
          if compiler["family"] != "gcc" or compiler["revision"] != os.environ["COMPILER_REVISION"]:
              raise SystemExit("platform probe compiler mismatch")
          if compiler["target"].split("-", 1)[0] != "x86_64":
              raise SystemExit(f"linux/amd64 target mismatch: {compiler['target']!r}")
          candidate_batch_id = os.environ["CANDIDATE_BATCH_ID"]
          expected_batch_id = (
              f"{os.environ['GITHUB_SHA']}:{os.environ['SOURCES_SHA256']}:"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          if candidate_batch_id != expected_batch_id:
              raise SystemExit("candidate batch identity mismatch")
          batch_workflow_run = os.environ["BATCH_WORKFLOW_RUN"]
          batch_match = re.fullmatch(
              rf"{re.escape(os.environ['GITHUB_RUN_ID'])}\.([1-9][0-9]*)",
              batch_workflow_run,
          )
          if batch_match is None or int(batch_match.group(1)) > int(os.environ["GITHUB_RUN_ATTEMPT"]):
              raise SystemExit("candidate batch origin is invalid or from the future")
          producer_workflow_run = f"{os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          record = {
              "schema": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "sources_sha256": os.environ["SOURCES_SHA256"],
              "candidate_batch_id": candidate_batch_id,
              "workflow_run": batch_workflow_run,
              "producer_workflow_run": producer_workflow_run,
              "toolchain": os.environ["TOOLCHAIN"],
              "repository": os.environ["REPOSITORY"],
              "platform": os.environ["EXPECTED_PLATFORM"],
              "manifest_digest": digest,
              "compiler_revision": compiler["revision"],
              "compiler_version": compiler["version"],
              "target": compiler["target"],
              "stdlib": compiler["stdlib"],
          }
          with open(sys.argv[1], "w", encoding="utf-8", newline="\n") as output:
              json.dump(record, output, indent=2, sort_keys=True)
              output.write("\n")
          PY
          rm "${receipt_dir}/build-metadata.json"

      - name: Upload the native manifest receipt
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-gcc-amd64-${{ github.run_attempt }}
          path: build/candidate-gcc-amd64/receipt.json
          if-no-files-found: error
          retention-days: 7

  build_gcc_arm64:
    name: Build GCC 16.2 candidate (linux/arm64)
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all'
    needs: initialize_candidate_batch
    runs-on: ubuntu-24.04-arm
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
    permissions:
      contents: read
      packages: write
    env:
      BATCH_WORKFLOW_RUN: ${{ needs.initialize_candidate_batch.outputs.workflow_run }}
      BAKE_TARGET: gcc16-arm64
      CANDIDATE_BATCH_ID: ${{ needs.initialize_candidate_batch.outputs.candidate_batch_id }}
      COMPILER: g++
      COMPILER_REVISION: 16.2.0
      EXPECTED_ARCH: arm64
      EXPECTED_PLATFORM: linux/arm64
      LOCK_RUNNER: ubuntu-24.04-arm
      PROBE_NODE: arm64_linux_gcc
      REPOSITORY: ghcr.io/ximicpp/typelayout-gcc16
      RUNNER_LABEL: ubuntu-24.04-arm
      TOOLCHAIN: gcc
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate and load the committed source lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-toolchain-locks.py \
            --sources .github/docker/toolchain-sources.lock \
            --recipe-root .
          python3 - "${LOCK_RUNNER}" "${GITHUB_OUTPUT}" >> "${GITHUB_ENV}" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          lock_path = pathlib.Path(".github/docker/toolchain-sources.lock")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          runner = lock["linux"]["docker"]["runners"][sys.argv[1]]
          print(f"SOURCES_SHA256={hashlib.sha256(lock_path.read_bytes()).hexdigest()}")
          print(f"LOCKED_DOCKER_CLIENT={runner['client_version']}")
          print(f"LOCKED_DOCKER_SERVER={runner['server_version']}")
          buildx_version = lock["linux"]["docker"]["buildx_version"]
          print(f"LOCKED_BUILDX_VERSION={buildx_version}")
          buildkit_image = lock["linux"]["docker"]["buildkit_image"]
          print(f"LOCKED_BUILDKIT_IMAGE={buildkit_image}")
          with open(sys.argv[2], "a", encoding="utf-8") as outputs:
              outputs.write(f"buildkit_image={buildkit_image}\n")
              outputs.write(f"buildx_version={buildx_version}\n")
          PY

      - name: Verify the locked Docker and Buildx identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker version --format '{{.Client.Version}}')" = "${LOCKED_DOCKER_CLIENT}"
          test "$(docker version --format '{{.Server.Version}}')" = "${LOCKED_DOCKER_SERVER}"
          buildx_output="$(docker buildx version)"
          python3 - "${LOCKED_BUILDX_VERSION}" "${buildx_output}" <<'PY'
          import re
          import sys

          expected, output = sys.argv[1:]
          versions = re.findall(r"(?<![0-9])v?([0-9]+\.[0-9]+\.[0-9]+)(?![0-9])", output)
          if expected not in versions:
              raise SystemExit(f"Buildx version mismatch: {output!r} != {expected!r}")
          PY

      - name: Create the locked BuildKit builder
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
