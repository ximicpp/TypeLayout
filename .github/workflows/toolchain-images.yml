          import json
          import os
          import pathlib
          import re
          import sys

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate key: {key}")
                  result[key] = value
              return result

          root = pathlib.Path(sys.argv[1])
          records = {}
          exact_keys = {
              "schema", "source_sha", "sources_sha256", "candidate_batch_id",
              "workflow_run", "producer_workflow_run", "toolchain",
              "repository", "platform", "manifest_digest", "compiler_revision",
              "compiler_version", "target", "stdlib",
          }
