              outputs.write(f"buildx_version={buildx_version}\n")
          PY

      - name: Verify the locked Docker and Buildx identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker version --format '{{.Client.Version}}')" = "${LOCKED_DOCKER_CLIENT}"
          test "$(docker version --format '{{.Server.Version}}')" = "${LOCKED_DOCKER_SERVER}"
          buildx_output="$(docker buildx version)"
          python3 - "${LOCKED_BUILDX_VERSION}" "${buildx_output}" <<'PY'
          import re
          import sys

          expected, output = sys.argv[1:]
          versions = re.findall(r"(?<![0-9])v?([0-9]+\.[0-9]+\.[0-9]+)(?![0-9])", output)
          if expected not in versions:
              raise SystemExit(f"Buildx version mismatch: {output!r} != {expected!r}")
          PY

      - name: Create the locked BuildKit builder
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: docker-container
          driver-opts: image=${{ steps.lock.outputs.buildkit_image }}
          version: v${{ steps.lock.outputs.buildx_version }}
          cache-binary: false

      - name: Verify the created builder
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          buildx_output="$(docker buildx version)"
          python3 - "${LOCKED_BUILDX_VERSION}" "${buildx_output}" <<'PY'
          import re
          import sys

          expected, output = sys.argv[1:]
          versions = re.findall(r"(?<![0-9])v?([0-9]+\.[0-9]+\.[0-9]+)(?![0-9])", output)
          if expected not in versions:
              raise SystemExit(f"Buildx version mismatch: {output!r} != {expected!r}")
          PY
          docker buildx inspect "${BUILDER_NAME}" --bootstrap | tee buildx-inspect.txt
          python3 - "${LOCKED_BUILDKIT_IMAGE}" buildx-inspect.txt <<'PY'
          # BEGIN BUILDX INSPECT VERIFIER
          import shlex
          import sys

          expected_image, path = sys.argv[1:]
          fields = {}
          with open(path, encoding="utf-8") as source:
              for line in source:
                  key, separator, value = line.partition(":")
                  key = key.strip()
                  if separator and key in {"Driver", "Driver Options"}:
                      fields.setdefault(key, []).append(value.strip())

          if fields.get("Driver") != ["docker-container"]:
              raise SystemExit(f"unexpected Buildx driver fields: {fields.get('Driver')!r}")
          driver_options = fields.get("Driver Options", [])
          if len(driver_options) != 1:
              raise SystemExit(f"unexpected Buildx driver option fields: {driver_options!r}")
          parsed_options = {}
          for option in shlex.split(driver_options[0]):
              name, separator, value = option.partition("=")
              if not separator or not name or name in parsed_options:
                  raise SystemExit(f"malformed Buildx driver options: {driver_options[0]!r}")
              parsed_options[name] = value
          if parsed_options != {"image": expected_image}:
              raise SystemExit(
                  f"BuildKit driver options mismatch: {parsed_options!r}"
              )
          # END BUILDX INSPECT VERIFIER
          PY

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the native manifest by digest
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p build/candidate-p2996-arm64
          docker buildx bake \
            --builder "${BUILDER_NAME}" \
            --file .github/docker/docker-bake.hcl \
            --metadata-file build/candidate-p2996-arm64/build-metadata.json \
            --set "${BAKE_TARGET}.output=type=image,push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true" \
            "p2996-arm64"

      - name: Run the candidate probe and write its receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir=build/candidate-p2996-arm64
          manifest_digest="$(python3 - "${receipt_dir}/build-metadata.json" "${BAKE_TARGET}" <<'PY'
          import json
          import re
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))[sys.argv[2]]["containerimage.digest"]
          if re.fullmatch(r"sha256:[0-9a-f]{64}", value) is None:
              raise SystemExit(f"invalid manifest digest: {value!r}")
          print(value)
          PY
          )"
          image="${REPOSITORY}@${manifest_digest}"
          docker pull "${image}"
          docker run --rm "${image}" /tmp/toolchain-probe
          runtime_dir=/opt/p2996-toolchain/lib/aarch64-unknown-linux-gnu
          docker run --rm "${image}" test -d "${runtime_dir}"
          docker run --rm "${image}" sh -eu -c 'ldd /tmp/toolchain-probe' > "${receipt_dir}/ldd.txt"
          python3 - "${receipt_dir}/ldd.txt" "${runtime_dir}" <<'PY'
          import pathlib
          import re
          import sys

          log_path, runtime_dir = pathlib.Path(sys.argv[1]), sys.argv[2].rstrip("/")
          families = {
              "libc++": re.compile(r"^libc\+\+\.so(?:\.[0-9]+)*$"),
              "libc++abi": re.compile(r"^libc\+\+abi\.so(?:\.[0-9]+)*$"),
              "libunwind": re.compile(r"^libunwind\.so(?:\.[0-9]+)*$"),
          }
          resolved = {family: [] for family in families}
          for line in log_path.read_text(encoding="utf-8").splitlines():
              tokens = line.split()
              if not tokens:
                  continue
              if "=>" in tokens:
                  marker = tokens.index("=>")
                  if marker == 0 or marker + 1 >= len(tokens):
                      raise SystemExit("malformed P2996 runtime linkage line")
                  soname, path = tokens[0], tokens[marker + 1]
              else:
                  path = tokens[0]
                  soname = pathlib.PurePosixPath(path).name
              for family, pattern in families.items():
                  if pattern.fullmatch(soname):
                      resolved[family].append(path)
          for family, paths in resolved.items():
              if len(paths) != 1:
                  raise SystemExit(f"P2996 runtime linkage must resolve exactly one {family}: {paths!r}")
              path = paths[0]
              if not path.startswith(runtime_dir + "/"):
                  raise SystemExit(f"P2996 runtime linkage escaped the bundled directory: {family} -> {path}")
          PY
          runner_image="${ImageOS-unknown}/${ImageVersion-unknown}"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --volume "${GITHUB_WORKSPACE}/${receipt_dir}:/receipt" \
            --workdir /src \
            --env COMPILER_REVISION="${COMPILER_REVISION}" \
            --env RUNNER_IMAGE="${runner_image}" \
            "${image}" \
            bash -euo pipefail -c '
              cmake -S /src -B /tmp/candidate-platform-probe -G Ninja \
                -DTYPELAYOUT_TOOLCHAIN_REVISION="${COMPILER_REVISION}"
              cmake --build /tmp/candidate-platform-probe \
                --target relocatable_world_platform_probe --parallel
              /tmp/candidate-platform-probe/relocatable_world_platform_probe \
                arm64_linux_clang /receipt/platform-probe.json \
                --runner ubuntu-24.04-arm --runner-image "${RUNNER_IMAGE}" \
                --xcode-version none --xcode-build none \
                --sdk-version none --sdk-build none \
                --deployment-target none --sdk-locked true
            '
          export MANIFEST_DIGEST="${manifest_digest}"
          python3 - "${receipt_dir}/receipt.json" "${receipt_dir}/platform-probe.json" <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          digest = os.environ["MANIFEST_DIGEST"]
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid manifest_digest")
          sys.path.insert(0, str(pathlib.Path("tools").resolve()))
          import relocatable_world_evidence as evidence
          probe = evidence.validate_probe(pathlib.Path(sys.argv[2]))
          expected_gates = {
              "char_bit": 8,
              "pointer_bits": 64,
              "endian": "little",
              "reflection": True,
              "memcpy_object_lifetime": True,
              "memcpy_array_lifetime": True,
          }
          if probe["node"] != os.environ["PROBE_NODE"] or probe["probe"] != expected_gates:
              raise SystemExit("platform probe identity or capability mismatch")
          if set(probe["admission"].values()) != {True}:
              raise SystemExit("candidate must admit all four contract types")
          if probe["environment"]["runner"] != os.environ["RUNNER_LABEL"]:
              raise SystemExit("platform probe runner mismatch")
          compiler = probe["compiler"]
          if compiler["family"] != "clang" or compiler["revision"] != os.environ["COMPILER_REVISION"]:
              raise SystemExit("platform probe compiler mismatch")
          if compiler["target"] != "aarch64-unknown-linux-gnu":
              raise SystemExit(f"linux/arm64 target mismatch: {compiler['target']!r}")
          candidate_batch_id = os.environ["CANDIDATE_BATCH_ID"]
          expected_batch_id = (
              f"{os.environ['GITHUB_SHA']}:{os.environ['SOURCES_SHA256']}:"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          if candidate_batch_id != expected_batch_id:
              raise SystemExit("candidate batch identity mismatch")
          batch_workflow_run = os.environ["BATCH_WORKFLOW_RUN"]
          batch_match = re.fullmatch(
              rf"{re.escape(os.environ['GITHUB_RUN_ID'])}\.([1-9][0-9]*)",
              batch_workflow_run,
          )
          if batch_match is None or int(batch_match.group(1)) > int(os.environ["GITHUB_RUN_ATTEMPT"]):
              raise SystemExit("candidate batch origin is invalid or from the future")
          producer_workflow_run = f"{os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          record = {
              "schema": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "sources_sha256": os.environ["SOURCES_SHA256"],
              "candidate_batch_id": candidate_batch_id,
              "workflow_run": batch_workflow_run,
              "producer_workflow_run": producer_workflow_run,
              "toolchain": os.environ["TOOLCHAIN"],
              "repository": os.environ["REPOSITORY"],
              "platform": os.environ["EXPECTED_PLATFORM"],
              "manifest_digest": digest,
              "compiler_revision": compiler["revision"],
              "compiler_version": compiler["version"],
              "target": compiler["target"],
              "stdlib": compiler["stdlib"],
          }
          with open(sys.argv[1], "w", encoding="utf-8", newline="\n") as output:
              json.dump(record, output, indent=2, sort_keys=True)
              output.write("\n")
          PY
          rm "${receipt_dir}/build-metadata.json"

      - name: Upload the native manifest receipt
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-p2996-arm64-${{ github.run_attempt }}
          path: build/candidate-p2996-arm64/receipt.json
          if-no-files-found: error
          retention-days: 7

  build_p2996_macos_arm64:
    name: Build Bloomberg P2996 candidate (macOS ARM64)
    if: github.event_name == 'workflow_dispatch'
    needs: initialize_candidate_batch
    runs-on: macos-15
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
    env:
      BATCH_WORKFLOW_RUN: ${{ needs.initialize_candidate_batch.outputs.workflow_run }}
      CANDIDATE_BATCH_ID: ${{ needs.initialize_candidate_batch.outputs.candidate_batch_id }}
      EXPECTED_ARCHITECTURE: arm64
      MACOS_NODE: arm64_macos_clang
      OUTPUT_DIR: build/candidate-macos-arm64
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the committed source lock
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-toolchain-locks.py \
            --sources .github/docker/toolchain-sources.lock \
            --recipe-root .

      - name: Build and verify the locked native archive
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/build-p2996-macos.sh \
            --sources .github/docker/toolchain-sources.lock \
            --node arm64_macos_clang \
            --output-dir "${OUTPUT_DIR}"
          archive="$(find "${OUTPUT_DIR}" -maxdepth 1 -type f -name 'p2996-macos-arm64-*.tar.zst' -print)"
          test -n "${archive}"
          test "$(printf '%s\n' "${archive}" | wc -l | tr -d '[:space:]')" = 1
          metadata="${archive%.tar.zst}.metadata.json"
          verification="${archive%.tar.zst}.verification.json"
          archive_sha256="$(python3 - "${metadata}" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["archive_sha256"])
          PY
          )"
          .github/scripts/verify-p2996-toolchain.sh \
            --sources .github/docker/toolchain-sources.lock \
            --node arm64_macos_clang \
            --candidate-archive "${archive}" \
            --candidate-sha256 "${archive_sha256}" \
            --require-locked-sdk \
            --metadata-output "${verification}"

      - name: Validate the archive metadata contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${OUTPUT_DIR}" "${MACOS_NODE}" "${EXPECTED_ARCHITECTURE}" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          output_dir, node, architecture = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          source_path = pathlib.Path(".github/docker/toolchain-sources.lock")
          source = json.loads(source_path.read_text(encoding="utf-8"))
          sources_sha256 = hashlib.sha256(source_path.read_bytes()).hexdigest()
          revision = source["p2996"]["compiler_revision"]
          stem = f"p2996-macos-{architecture}-{revision}"
          archive = output_dir / f"{stem}.tar.zst"
          build_path = output_dir / f"{stem}.metadata.json"
          verify_path = output_dir / f"{stem}.verification.json"
          expected_files = {archive.name, build_path.name, verify_path.name}
          actual_files = {path.name for path in output_dir.iterdir() if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(f"unexpected macOS candidate files: {actual_files!r}")
          build = json.loads(build_path.read_text(encoding="utf-8"))
          verify = json.loads(verify_path.read_text(encoding="utf-8"))
          build_keys = {
              "schema", "node", "architecture", "compiler_revision", "archive",
              "archive_sha256", "archive_size", "xcode_version", "xcode_build",
              "sdk_version", "sdk_build", "deployment_target", "observed_runner",
          }
          verify_keys = {
              "schema", "node", "architecture", "archive_sha256", "compiler_revision",
              "compiler_version", "target", "stdlib", "xcode_version", "xcode_build",
              "sdk_version", "sdk_build", "deployment_target", "sdk_locked",
              "observed_runner", "environment", "flags",
          }
          if set(build) != build_keys or set(verify) != verify_keys:
              raise SystemExit("non-canonical macOS metadata keys")
          locked = source["macos"]["nodes"][node]
          expected = {
              "node": node,
              "architecture": architecture,
              "compiler_revision": revision,
              "xcode_version": locked["xcode_version"],
              "xcode_build": locked["xcode_build"],
              "sdk_version": locked["sdk_version"],
              "sdk_build": locked["sdk_build"],
              "deployment_target": locked["deployment_target"],
          }
          for key, value in expected.items():
              if build.get(key) != value or verify.get(key) != value:
                  raise SystemExit(f"macOS {key} mismatch")
          digest = sha256_file(archive)
          if re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid archive digest")
          if build["archive"] != archive.name or build["archive_sha256"] != digest:
              raise SystemExit("archive build metadata mismatch")
          if verify["archive_sha256"] != digest or verify["sdk_locked"] is not True:
              raise SystemExit("archive verification mismatch")
          if build["archive_size"] != archive.stat().st_size or not (0 < archive.stat().st_size < 2147483648):
              raise SystemExit("archive size must be below 2147483648 bytes")
          if build["observed_runner"] != verify["observed_runner"]:
              raise SystemExit("observed runner mismatch")
          if set(build["observed_runner"]) != {"image_os", "image_version"}:
              raise SystemExit("observed runner keys mismatch")
          if any(not value for value in build["observed_runner"].values()):
              raise SystemExit("empty observed runner identity")
          if verify["target"] != "arm64-apple-macosx15.0.0":
              raise SystemExit(f"compiler target mismatch: {verify['target']!r}")
          if any(not verify[key].strip() for key in ("compiler_version", "stdlib")):
              raise SystemExit("empty verified compiler identity")
          candidate_batch_id = os.environ["CANDIDATE_BATCH_ID"]
          expected_batch_id = (
              f"{os.environ['GITHUB_SHA']}:{sources_sha256}:"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          if candidate_batch_id != expected_batch_id:
              raise SystemExit("candidate batch identity mismatch")
          batch_workflow_run = os.environ["BATCH_WORKFLOW_RUN"]
          batch_match = re.fullmatch(
              rf"{re.escape(os.environ['GITHUB_RUN_ID'])}\.([1-9][0-9]*)",
              batch_workflow_run,
          )
          if batch_match is None or int(batch_match.group(1)) > int(os.environ["GITHUB_RUN_ATTEMPT"]):
              raise SystemExit("candidate batch origin is invalid or from the future")
          producer_workflow_run = f"{os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          candidate_receipt = {
              "schema": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "sources_sha256": sources_sha256,
              "candidate_batch_id": candidate_batch_id,
              "workflow_run": batch_workflow_run,
              "producer_workflow_run": producer_workflow_run,
              "node": node,
              "archive_sha256": digest,
          }
          with open(output_dir / "candidate-receipt.json", "w", encoding="utf-8", newline="\n") as output:
              json.dump(candidate_receipt, output, indent=2, sort_keys=True)
              output.write("\n")
          PY

      - name: Upload the native macOS archive
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-macos-arm64-${{ github.run_attempt }}
          path: build/candidate-macos-arm64
          if-no-files-found: error
          retention-days: 7

