          index_digest="$(reported_index_digest "${root}/manifest-summary.json")"
          exact_index_map "${root}/published-index.json" "${index_digest}"
          docker buildx imagetools inspect --raw "${REPOSITORY}@${index_digest}" > "${root}/digest-index.json"
          docker buildx imagetools inspect "${REPOSITORY}@${index_digest}" --format '{{json .Manifest}}' > "${root}/digest-summary.json"
          digest_reference="$(reported_index_digest "${root}/digest-summary.json")"
          test "${digest_reference}" = "${index_digest}"
          exact_index_map "${root}/digest-index.json" "${digest_reference}"
          export INDEX_DIGEST="${index_digest}"
          python3 - "${root}/index-base.json" "${root}/receipt.json" <<'PY'
          import json
          import os
          import re
          import sys

          record = json.load(open(sys.argv[1], encoding="utf-8"))
          digest = os.environ["INDEX_DIGEST"]
          platform_digests = {item["manifest_digest"] for item in record["platforms"].values()}
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None or digest in platform_digests:
              raise SystemExit("invalid or colliding index digest")
          record["index_digest"] = digest
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as output:
              json.dump(record, output, indent=2, sort_keys=True)
              output.write("\n")
          PY

      - name: Upload the GCC index receipt
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-gcc-index-${{ github.run_attempt }}
          path: build/index-gcc/receipt.json
          if-no-files-found: error
          retention-days: 7

