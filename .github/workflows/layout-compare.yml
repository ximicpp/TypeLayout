name: Layout Compare protocol

on:
  push:
    paths:
      - 'tools/layout-observer/dotnet/**'
      - 'tools/layout-observer/contracts/**'
      - 'tools/layout-observer/scripts/**'
      - '.github/workflows/layout-compare.yml'
  pull_request:
    paths:
      - 'tools/layout-observer/dotnet/**'
      - 'tools/layout-observer/contracts/**'
      - 'tools/layout-observer/scripts/**'
      - '.github/workflows/layout-compare.yml'
  workflow_dispatch:

jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/layout-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Core comparison contract
        run: dotnet run --project dotnet/LayoutObserver.CoreChecks -c Release
      - name: Language-independent signature conformance
        run: dotnet run --project dotnet/LayoutObserver.SignatureChecks -c Release
      - name: Report regression
        run: dotnet run --project dotnet/LayoutObserver.ReportChecks -c Release
      - name: Build public CLI
        run: dotnet build dotnet/LayoutObserver.Cli -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install contract validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt
      - name: Independent Python signature vectors and schemas
        run: python scripts/check-signature-vectors.py
